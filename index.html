<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 YouTube Video Summarizer - סימולטור סרטונים</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .progress-section {
            display: none;
            margin-top: 30px;
        }

        .progress-section.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            font-size: 0.95em;
            color: #666;
            margin-bottom: 10px;
        }

        .status-message {
            text-align: center;
            font-size: 1.1em;
            color: #333;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results.active {
            display: block;
        }

        .result-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-right: 4px solid #667eea;
        }

        .result-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .result-card p {
            color: #666;
            line-height: 1.6;
        }

        .moments-list {
            list-style: none;
        }

        .moments-list li {
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-right: 3px solid #764ba2;
        }

        .moment-time {
            color: #667eea;
            font-weight: 600;
            font-size: 0.9em;
        }

        .moment-desc {
            color: #333;
            margin: 5px 0;
        }

        .moment-importance {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .download-btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .download-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid #c62828;
            display: none;
            margin-top: 15px;
        }

        .error-message.active {
            display: block;
        }

        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid #2196F3;
            margin-bottom: 20px;
            color: #1565c0;
            font-size: 0.95em;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tip {
            background: #fff3cd;
            border-right: 4px solid #ff9800;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9em;
            color: #856404;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 25px 15px;
            }

            button {
                font-size: 1em;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube Video Summarizer</h1>
            <p>סוכם סרטונים אוטומטית עם AI</p>
        </div>

        <div class="content">
            <div class="info-box">
                💡 <strong>הדרך:</strong> הכנס URL של סרטון YouTube, ותן לנו להפוך אותו לסרטון מקוצר בעזרת בינה מלאכותית
            </div>

            <form id="summarizeForm">
                <div class="form-group">
                    <label for="videoUrl">🎬 כתובת YouTube (URL):</label>
                    <input
                        type="text"
                        id="videoUrl"
                        placeholder="https://www.youtube.com/watch?v=..."
                        required
                    >
                    <div class="tip">
                        💡 בחר סרטון זמין בצפייה חיצונית (לא מוגן או מחוק)
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        🚀 התחל סיכום
                    </button>
                    <button type="reset" class="btn-reset" id="resetBtn">
                        🔄 אפס
                    </button>
                </div>
            </form>

            <!-- התקדמות -->
            <div class="progress-section" id="progressSection">
                <div class="status-message" id="statusMessage">
                    ⏳ מעבדת סרטון...
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressPercent">0</span>%
                </div>
            </div>

            <!-- שגיאה -->
            <div class="error-message" id="errorMessage"></div>

            <!-- תוצאות -->
            <div class="results" id="results">
                <div class="result-card">
                    <h3>📝 סיכום הסרטון</h3>
                    <p id="summary"></p>
                </div>

                <div class="result-card">
                    <h3>🎯 רגעים חשובים</h3>
                    <ul class="moments-list" id="momentsList"></ul>
                </div>

                <div class="result-card">
                    <h3>✨ כותרת מוצעת</h3>
                    <p id="suggestedTitle"></p>
                    <a href="#" class="download-btn" id="downloadBtn">📥 הוריד סרטון מקוצר</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('summarizeForm');
        const videoUrlInput = document.getElementById('videoUrl');
        const submitBtn = document.getElementById('submitBtn');
        const progressSection = document.getElementById('progressSection');
        const statusMessage = document.getElementById('statusMessage');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const resultsDiv = document.getElementById('results');
        const errorMessage = document.getElementById('errorMessage');

        let currentResult = null;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = videoUrlInput.value.trim();
            if (!url) {
                showError('נא הזן URL תקין');
                return;
            }

            // שמור על הכפתור מכוגבל
            submitBtn.disabled = true;
            progressSection.classList.add('active');
            resultsDiv.classList.remove('active');
            errorMessage.classList.remove('active');

            try {
                // שלח בקשה
                const response = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'שגיאה בשרת');
                }

                // עדכן התקדמות כל שנייה
                await pollProgress();

            } catch (error) {
                showError(error.message);
                progressSection.classList.remove('active');
            } finally {
                submitBtn.disabled = false;
            }
        });

        async function pollProgress() {
            return new Promise((resolve) => {
                const interval = setInterval(async () => {
                    try {
                        const response = await fetch('/api/progress');
                        const data = await response.json();

                        // עדכן UI
                        statusMessage.textContent = data.message;
                        progressFill.style.width = data.progress + '%';
                        progressPercent.textContent = data.progress;

                        if (data.status === 'completed') {
                            clearInterval(interval);
                            progressSection.classList.remove('active');
                            showResults(data.result);
                            resolve();
                        } else if (data.status === 'error') {
                            clearInterval(interval);
                            progressSection.classList.remove('active');
                            showError(data.error);
                            resolve();
                        }
                    } catch (error) {
                        console.error('שגיאה בעדכון התקדמות:', error);
                    }
                }, 500);
            });
        }

        function showResults(result) {
            if (!result) return;

            currentResult = result;

            // סיכום
            document.getElementById('summary').textContent = result.summary;

            // רגעים חשובים
            const momentsList = document.getElementById('momentsList');
            momentsList.innerHTML = '';
            result.moments.forEach((moment, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="moment-time">⏱️ ${moment.start_time.toFixed(1)}m - ${moment.end_time.toFixed(1)}m</div>
                    <div class="moment-desc">📌 ${moment.description}</div>
                    <div class="moment-importance">💡 ${moment.importance}</div>
                `;
                momentsList.appendChild(li);
            });

            // כותרת מוצעת
            document.getElementById('suggestedTitle').textContent = result.title;

            // כפתור הורדה
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = `/api/download/${result.video_file}`;

            resultsDiv.classList.add('active');
        }

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('active');
        }
    </script>
</body>
</html>
